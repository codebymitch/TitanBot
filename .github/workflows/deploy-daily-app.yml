name: Deploy daily-app website

# מעלה את התיקייה daily-app ל־GitHub Pages בכל עדכון של main
on:
  push:
    branches: [main]
    paths:
      - 'daily-app/**'
      - '.github/workflows/deploy-daily-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: daily-app
      - id: deployment
        uses: actions/deploy-pages@v4
