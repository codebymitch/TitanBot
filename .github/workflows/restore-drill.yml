name: Restore Drill

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexobot
          POSTGRES_PASSWORD: nexobot
          POSTGRES_DB: nexobot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexobot -d nexobot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://nexobot:nexobot@localhost:5432/nexobot
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: nexobot
      POSTGRES_USER: nexobot
      POSTGRES_PASSWORD: nexobot
      POSTGRES_SSL: "false"
      SCHEMA_VERSION: "1"
      SCHEMA_VERSION_LABEL: "baseline-v1"
      BACKUP_RETENTION_DAYS: "7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install PostgreSQL client tools
        run: sudo apt-get update ; sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run migrate

      - name: Run restore drill
        run: npm run backup:drill
