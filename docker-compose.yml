services:
  bot:
    build: .
    container_name: titanbot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POSTGRES_HOST=db
      - PORT=3000
      - OWNER_IDS=${OWNER_IDS}
      - ADMIN_IDS=${ADMIN_IDS}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - DASHBOARD_EMAIL=${DASHBOARD_EMAIL}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI:-http://localhost:3000/auth/discord/callback}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_started
    networks:
      - titan-network

  db:
    image: postgres:15-alpine
    container_name: titanbot-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-titanbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-titanbotpassword}
      - POSTGRES_DB=${POSTGRES_DB:-titanbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-network

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512m
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    networks:
      - titan-network
    healthcheck:
      disable: true

networks:
  titan-network:
    driver: bridge

volumes:
  postgres_data:
