<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Sign In</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#1e1f22; --card:#2b2d31; --border:#3f4147;
      --accent:#5865f2; --accent-h:#4752c4;
      --discord:#5865f2; --discord-h:#4752c4;
      --text:#f2f3f5; --sub:#b5bac1; --muted:#80848e;
      --err:#f23f43; --input:#1e1f22; --green:#23a55a;
    }
    body {
      font-family:'Segoe UI',system-ui,sans-serif;
      background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
    }
    .card {
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      padding:40px 36px; width:100%; max-width:420px;
      box-shadow:0 24px 64px rgba(0,0,0,.45);
    }
    .top { text-align:center; margin-bottom:28px; }
    .avatar { width:72px; height:72px; border-radius:50%; background:var(--accent); margin:0 auto 16px; display:block; object-fit:cover; }
    h1 { font-size:21px; font-weight:800; margin-bottom:5px; }
    .sub { color:var(--muted); font-size:13px; }

    /* Discord button */
    .btn-discord {
      width:100%; background:var(--discord); color:#fff; border:none;
      border-radius:10px; padding:13px 16px; font-size:15px; font-weight:700;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      transition:background .15s, transform .1s; text-decoration:none;
    }
    .btn-discord:hover { background:var(--discord-h); }
    .btn-discord:active { transform:scale(.98); }
    .discord-icon { width:22px; height:22px; flex-shrink:0; }

    /* Divider */
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--muted); font-size:12px; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* Email form */
    .field { margin-bottom:14px; }
    .field label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); display:block; margin-bottom:7px; }
    .field input {
      width:100%; background:var(--input); border:1.5px solid var(--border);
      border-radius:8px; padding:11px 14px; color:var(--text); font-size:14px; outline:none;
      transition:border-color .15s;
    }
    .field input:focus { border-color:var(--accent); }
    .field input::placeholder { color:var(--muted); }

    .btn-email {
      width:100%; background:var(--bg); color:var(--text);
      border:1.5px solid var(--border); border-radius:10px; padding:12px;
      font-size:14px; font-weight:700; cursor:pointer; margin-top:4px;
      transition:border-color .15s, background .15s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-email:hover { border-color:var(--accent); background:rgba(88,101,242,.08); }
    .btn-email:disabled { opacity:.5; cursor:not-allowed; }

    .error { color:var(--err); font-size:13px; margin-top:12px; text-align:center; min-height:18px; }
    .success { color:var(--green); font-size:13px; margin-top:12px; text-align:center; }

    .hint { color:var(--muted); font-size:11px; margin-top:18px; text-align:center; line-height:1.5; }
    .hint a { color:var(--accent); text-decoration:none; }
    .hint a:hover { text-decoration:underline; }

    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .6s linear infinite; }
    .spinner.dark { border-color:rgba(88,101,242,.25); border-top-color:var(--accent); }
    @keyframes spin { to{transform:rotate(360deg);} }

    .email-section { display:none; }
    .email-section.visible { display:block; }
  </style>
</head>
<body>
<div class="card">
  <div class="top">
    <img class="avatar" id="av" src="" alt="" onerror="this.style.visibility='hidden'">
    <h1 id="botName">Dashboard</h1>
    <p class="sub">Sign in to access the bot dashboard</p>
  </div>

  <!-- Discord OAuth2 -->
  <a class="btn-discord" id="discordBtn" href="/auth/discord">
    <svg class="discord-icon" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
    </svg>
    Login with Discord
  </a>

  <div class="divider">or</div>

  <!-- Email form -->
  <div id="emailSection" class="email-section">
    <form id="emailForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="pw" placeholder="Dashboard password" required>
      </div>
      <button class="btn-email" type="submit" id="emailBtn">
        Sign In with Email
      </button>
    </form>
  </div>

  <div id="noEmail" style="text-align:center;color:var(--muted);font-size:13px;">
    <span style="font-size:20px;">📧</span><br>
    Email login not configured.<br>
    <a href="#" id="showSetup" style="color:var(--accent);font-size:12px;">How to enable it</a>
  </div>

  <div class="error" id="err"></div>

  <p class="hint" id="hint">
    For Discord login, make sure <code style="background:var(--bg3,#313338);padding:1px 5px;border-radius:4px;">CLIENT_SECRET</code> is set in your <code style="background:var(--bg3,#313338);padding:1px 5px;border-radius:4px;">.env</code>
  </p>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('dashboard_token')) window.location.href = '/dashboard';

  // Show error from URL (e.g. ?error=token_failed)
  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr) {
    const msgs = {
      no_code: 'Discord login was cancelled.',
      token_failed: 'Failed to exchange Discord token. Is CLIENT_SECRET set correctly?',
      user_failed: 'Could not fetch your Discord profile.',
      oauth_disabled: 'Discord login is not configured. Set CLIENT_SECRET in .env',
    };
    document.getElementById('err').textContent = msgs[urlErr] || 'Login failed: ' + urlErr;
  }

  // Fetch bot info + check which login methods are available
  fetch('/api/loginconfig').then(r=>r.json()).then(cfg => {
    document.getElementById('botName').textContent = (cfg.username || 'Bot') + ' Dashboard';
    const av = document.getElementById('av');
    if (cfg.avatar) { av.src = cfg.avatar; av.style.visibility = 'visible'; }

    // Discord button — disable if not configured
    if (!cfg.discordEnabled) {
      const btn = document.getElementById('discordBtn');
      btn.style.opacity = '.45';
      btn.style.cursor = 'not-allowed';
      btn.removeAttribute('href');
      btn.addEventListener('click', e => { e.preventDefault(); document.getElementById('err').textContent = 'Discord login requires CLIENT_SECRET in .env'; });
    }

    // Email section
    if (cfg.emailEnabled) {
      document.getElementById('emailSection').classList.add('visible');
      document.getElementById('noEmail').style.display = 'none';
      document.getElementById('hint').style.display = 'none';
    }
  }).catch(() => {});

  document.getElementById('showSetup').addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('err').textContent = 'Set DASHBOARD_EMAIL and DASHBOARD_PASSWORD in your .env file, then redeploy.';
  });

  document.getElementById('emailForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('emailBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner dark"></div> Signing in…';
    document.getElementById('err').textContent = '';

    try {
      const res = await fetch('/api/login/email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('pw').value,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('dashboard_token', data.token);
        window.location.href = '/dashboard';
      } else {
        document.getElementById('err').textContent = data.error || 'Login failed.';
        btn.disabled = false;
        btn.textContent = 'Sign In with Email';
      }
    } catch {
      document.getElementById('err').textContent = 'Could not reach the server.';
      btn.disabled = false;
      btn.textContent = 'Sign In with Email';
    }
  });
</script>
</body>
</html>
