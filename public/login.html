<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0d0e12;
      --card:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.08);
      --accent:#5865f2;
      --accent2:#eb459e;
      --text:#f0f0f5;
      --sub:#9094a8;
      --muted:#555b6e;
      --err:#f23f43;
      --input:rgba(255,255,255,0.04);
    }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    /* ── Animated background ── */
    .bg {
      position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse at 20% 50%, rgba(88,101,242,.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(235,69,158,.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 60% 80%, rgba(88,101,242,.1) 0%, transparent 50%),
                  #0d0e12;
    }
    .blob {
      position:absolute; border-radius:50%; filter:blur(80px); opacity:.35; animation:drift 12s ease-in-out infinite;
    }
    .blob1 { width:400px; height:400px; background:#5865f2; top:-10%; left:-10%; animation-delay:0s; }
    .blob2 { width:300px; height:300px; background:#eb459e; bottom:-5%; right:-5%; animation-delay:-4s; }
    .blob3 { width:250px; height:250px; background:#23a55a; top:50%; left:60%; animation-delay:-8s; }
    @keyframes drift {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(30px,-20px) scale(1.05); }
      66%      { transform:translate(-15px,25px) scale(.95); }
    }
    .grid-overlay {
      position:absolute; inset:0;
      background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Card ── */
    .card {
      position:relative; z-index:10;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      padding:44px 40px;
      width:100%; max-width:420px;
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
      animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes slideUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:none; } }

    .top { text-align:center; margin-bottom:32px; }
    .avatar-wrap { position:relative; width:76px; height:76px; margin:0 auto 16px; }
    .avatar { width:76px; height:76px; border-radius:50%; object-fit:cover; display:block; }
    .avatar-ring {
      position:absolute; inset:-3px; border-radius:50%;
      background: linear-gradient(135deg, #5865f2, #eb459e);
      z-index:-1; animation:spin 4s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    h1 {
      font-size:22px; font-weight:800; letter-spacing:-.5px;
      background:linear-gradient(135deg, #fff 40%, #9094a8);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .sub { color:var(--sub); font-size:13px; margin-top:5px; }

    /* ── Discord button ── */
    .btn-discord {
      width:100%; border:none; border-radius:12px; padding:14px 16px;
      font-size:15px; font-weight:700; font-family:'Inter',sans-serif;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      text-decoration:none; color:#fff;
      background:linear-gradient(135deg, #5865f2, #4752c4);
      box-shadow:0 0 0 0 rgba(88,101,242,.5);
      transition:transform .15s, box-shadow .2s;
      position:relative; overflow:hidden;
    }
    .btn-discord::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
      opacity:0; transition:opacity .2s;
    }
    .btn-discord:hover { transform:translateY(-1px); box-shadow:0 0 28px rgba(88,101,242,.55); }
    .btn-discord:hover::after { opacity:1; }
    .btn-discord:active { transform:scale(.98); }
    .btn-discord.disabled { opacity:.38; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
    .discord-icon { width:22px; height:22px; flex-shrink:0; }

    /* ── Remember toggle ── */
    .remember-row {
      display:flex; align-items:center; gap:10px; margin-top:14px; cursor:pointer;
      user-select:none;
    }
    .toggle-wrap { position:relative; width:36px; height:20px; flex-shrink:0; }
    .toggle-input { opacity:0; width:0; height:0; position:absolute; }
    .toggle-track {
      position:absolute; inset:0; border-radius:10px;
      background:rgba(255,255,255,.1); border:1px solid var(--border);
      transition:background .2s, border-color .2s;
    }
    .toggle-thumb {
      position:absolute; width:14px; height:14px; border-radius:50%;
      background:#fff; top:2px; left:2px;
      transition:transform .2s, background .2s;
      box-shadow:0 1px 3px rgba(0,0,0,.4);
    }
    .toggle-input:checked + .toggle-track { background:var(--accent); border-color:var(--accent); }
    .toggle-input:checked + .toggle-track + .toggle-thumb { transform:translateX(16px); }
    .remember-label { font-size:13px; color:var(--sub); font-weight:500; }

    /* ── Divider ── */
    .divider { display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--muted); font-size:12px; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Email form ── */
    .field { margin-bottom:14px; }
    .field label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); display:block; margin-bottom:7px; }
    .field input {
      width:100%; background:var(--input); border:1.5px solid var(--border);
      border-radius:10px; padding:12px 14px; color:var(--text); font-size:14px;
      font-family:'Inter',sans-serif; outline:none; transition:border-color .2s, box-shadow .2s;
    }
    .field input:focus { border-color:rgba(88,101,242,.6); box-shadow:0 0 0 3px rgba(88,101,242,.12); }
    .field input::placeholder { color:var(--muted); }

    .btn-email {
      width:100%; background:rgba(255,255,255,.06); color:var(--text);
      border:1.5px solid var(--border); border-radius:12px; padding:13px;
      font-size:14px; font-weight:700; font-family:'Inter',sans-serif;
      cursor:pointer; margin-top:4px; transition:all .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-email:hover { border-color:rgba(88,101,242,.5); background:rgba(88,101,242,.1); }
    .btn-email:disabled { opacity:.4; cursor:not-allowed; }

    .error { color:var(--err); font-size:12.5px; margin-top:12px; text-align:center; min-height:18px; line-height:1.4; }
    .hint { color:var(--muted); font-size:11px; margin-top:16px; text-align:center; line-height:1.6; }
    .hint code { background:rgba(255,255,255,.07); padding:1px 6px; border-radius:4px; font-size:11px; }

    .no-email { text-align:center; color:var(--sub); font-size:13px; }
    .no-email a { color:var(--accent); text-decoration:none; font-size:12px; }

    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; animation:rot .6s linear infinite; display:inline-block; }
    .spinner.dark { border-color:rgba(88,101,242,.2); border-top-color:var(--accent); }
    @keyframes rot { to { transform:rotate(360deg); } }
    .email-section { display:none; }
    .email-section.on { display:block; }
  </style>
</head>
<body>
<div class="bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="grid-overlay"></div>
</div>

<div class="card">
  <div class="top">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" id="av" src="" alt="" onerror="this.style.visibility='hidden'">
    </div>
    <h1 id="botName">Dashboard</h1>
    <p class="sub">Sign in to access the bot dashboard</p>
  </div>

  <a class="btn-discord" id="discordBtn" href="/auth/discord">
    <svg class="discord-icon" viewBox="0 0 24 24" fill="white"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.056a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Login with Discord
  </a>

  <!-- Remember me (shared between Discord & email) -->
  <label class="remember-row" id="rememberRow">
    <span class="toggle-wrap">
      <input type="checkbox" class="toggle-input" id="rememberMe">
      <span class="toggle-track"></span>
      <span class="toggle-thumb"></span>
    </span>
    <span class="remember-label">Keep me signed in for 30 days</span>
  </label>

  <div class="divider">or</div>

  <div id="emailSection" class="email-section">
    <form id="emailForm">
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="your@email.com" autocomplete="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="pw" placeholder="Dashboard password" required></div>
      <button class="btn-email" type="submit" id="emailBtn">Sign In with Email</button>
    </form>
  </div>
  <div id="noEmail" class="no-email">
    <div style="font-size:22px;margin-bottom:6px">📧</div>
    Email login not configured.<br>
    <a href="#" id="showSetup">How to enable it</a>
  </div>

  <div class="error" id="err"></div>
  <p class="hint" id="hint">Discord login requires <code>CLIENT_SECRET</code> in <code>.env</code></p>
</div>

<script>
  if (localStorage.getItem('dashboard_token')) window.location.href = '/dashboard';

  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr) {
    const msgs = { no_code:'Discord login was cancelled.', token_failed:'Failed to get Discord token. Check CLIENT_SECRET.', user_failed:'Could not fetch your Discord profile.', oauth_disabled:'Discord login requires CLIENT_SECRET in .env' };
    document.getElementById('err').textContent = msgs[urlErr] || 'Login failed: ' + urlErr;
  }

  fetch('/api/loginconfig').then(r=>r.json()).then(cfg=>{
    document.getElementById('botName').textContent = (cfg.username||'Bot') + ' Dashboard';
    const av = document.getElementById('av');
    if (cfg.avatar) { av.src = cfg.avatar; av.style.visibility='visible'; }

    if (!cfg.discordEnabled) {
      const b = document.getElementById('discordBtn');
      b.classList.add('disabled');
      b.removeAttribute('href');
      b.addEventListener('click', e => { e.preventDefault(); document.getElementById('err').textContent = 'Discord login requires CLIENT_SECRET in .env'; });
    } else {
      document.getElementById('hint').style.display='none';
    }

    if (cfg.emailEnabled) {
      document.getElementById('emailSection').classList.add('on');
      document.getElementById('noEmail').style.display='none';
    }
  }).catch(()=>{});

  // Wire remember-me toggle to Discord button href
  const rememberCheck = document.getElementById('rememberMe');
  const discordBtn = document.getElementById('discordBtn');
  function updateDiscordHref() {
    if (discordBtn.hasAttribute('href')) {
      discordBtn.href = rememberCheck.checked ? '/auth/discord?remember=1' : '/auth/discord';
    }
  }
  rememberCheck.addEventListener('change', updateDiscordHref);

  document.getElementById('showSetup').addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('err').textContent = 'Add DASHBOARD_EMAIL and DASHBOARD_PASSWORD to your .env, then redeploy.';
  });

  document.getElementById('emailForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('emailBtn');
    btn.disabled=true; btn.innerHTML='<div class="spinner dark"></div> Signing in…';
    document.getElementById('err').textContent='';
    try {
      const res = await fetch('/api/login/email',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('pw').value,
          remember: rememberCheck.checked,
        })
      });
      const data = await res.json();
      if (res.ok) { localStorage.setItem('dashboard_token',data.token); window.location.href='/dashboard'; }
      else { document.getElementById('err').textContent=data.error||'Login failed.'; btn.disabled=false; btn.textContent='Sign In with Email'; }
    } catch { document.getElementById('err').textContent='Could not reach the server.'; btn.disabled=false; btn.textContent='Sign In with Email'; }
  });
</script>
</body>
</html>
