<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Itay100K Itay100K Bot Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#08090c;
      --surface:#0f1117;
      --card:#13151c;
      --border:rgba(255,255,255,0.07);
      --border-lit:rgba(255,255,255,0.13);
      --accent:#5865f2;
      --accent-glow:rgba(88,101,242,0.35);
      --text:#eeeef0;
      --sub:#8b8fa8;
      --muted:#4a4e63;
      --err:#f23f43;
    }

    html, body {
      height:100%;
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body {
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    /* ── Noise overlay ── */
    body::before {
      content:'';
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity:.5;
    }

    /* ── Glow spots ── */
    .glow-a {
      position:fixed; z-index:0; pointer-events:none;
      width:700px; height:700px; border-radius:50%;
      background:radial-gradient(circle, rgba(88,101,242,.13) 0%, transparent 70%);
      top:-200px; left:-200px;
    }
    .glow-b {
      position:fixed; z-index:0; pointer-events:none;
      width:500px; height:500px; border-radius:50%;
      background:radial-gradient(circle, rgba(235,69,158,.07) 0%, transparent 70%);
      bottom:-100px; right:-100px;
    }

    /* ── Top bar ── */
    .topbar {
      position:relative; z-index:10;
      padding:18px 28px;
      display:flex; align-items:center; gap:10px;
      border-bottom:1px solid var(--border);
    }
    .topbar-logo {
      width:28px; height:28px; border-radius:8px;
      background:linear-gradient(135deg,#5865f2,#4752c4);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; flex-shrink:0;
    }
    .topbar-name { font-size:13px; font-weight:700; color:var(--text); letter-spacing:-.2px; }
    .topbar-right { margin-left:auto; }
    .status-dot-wrap { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); }
    .sdot { width:7px; height:7px; border-radius:50%; background:#23a55a; box-shadow:0 0 6px rgba(35,165,90,.6); flex-shrink:0; }

    /* ── Main layout ── */
    .main {
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
      position:relative; z-index:10;
    }

    /* ── Card ── */
    .card {
      width:100%; max-width:400px;
      background:var(--card);
      border:1px solid var(--border-lit);
      border-radius:20px;
      box-shadow:
        0 0 0 1px rgba(0,0,0,.4),
        0 20px 60px rgba(0,0,0,.5),
        0 0 80px rgba(88,101,242,.06);
      overflow:hidden;
      animation:rise .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes rise { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:none} }

    /* ── Card top strip ── */
    .card-strip {
      height:3px;
      background:linear-gradient(90deg, #5865f2, #eb459e, #5865f2);
      background-size:200% 100%;
      animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Card body ── */
    .card-body { padding:36px 32px 32px; }

    /* ── Avatar ── */
    .brand { display:flex; flex-direction:column; align-items:center; margin-bottom:28px; }
    .av-wrap {
      position:relative; width:72px; height:72px; margin-bottom:14px;
    }
    .av-fallback {
      width:72px; height:72px; border-radius:18px;
      background:linear-gradient(135deg, #5865f2, #4752c4);
      display:flex; align-items:center; justify-content:center;
      font-size:30px; border:1px solid rgba(88,101,242,.4);
    }
    .av {
      width:72px; height:72px; border-radius:18px;
      object-fit:cover; display:none;
      border:1px solid var(--border-lit);
      background:var(--surface);
    }
    .av-status {
      position:absolute; bottom:-3px; right:-3px;
      width:18px; height:18px; border-radius:50%;
      background:#23a55a; border:3px solid var(--card);
      box-shadow:0 0 8px rgba(35,165,90,.5);
    }
    .brand-name {
      font-size:20px; font-weight:800; letter-spacing:-.5px; color:var(--text);
      text-align:center;
    }
    .brand-sub { font-size:13px; color:var(--sub); margin-top:4px; text-align:center; }

    /* ── Discord button ── */
    .btn-discord {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:13px 18px; border-radius:12px; border:none;
      background:#5865f2;
      color:#fff; font-size:14px; font-weight:700; font-family:'Inter',sans-serif;
      text-decoration:none; cursor:pointer;
      box-shadow:0 2px 12px rgba(88,101,242,.3), inset 0 1px 0 rgba(255,255,255,.15);
      transition:filter .15s, transform .12s, box-shadow .15s;
      position:relative; overflow:hidden;
    }
    .btn-discord::before {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(180deg, rgba(255,255,255,.08) 0%, transparent 100%);
    }
    .btn-discord:hover { filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 6px 20px rgba(88,101,242,.45), inset 0 1px 0 rgba(255,255,255,.15); }
    .btn-discord:active { transform:scale(.98); filter:brightness(.97); }
    .btn-discord.disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }
    .discord-icon { width:20px; height:20px; flex-shrink:0; }

    /* ── Remember row ── */
    .remember-row {
      display:flex; align-items:center; gap:10px;
      margin-top:14px; cursor:pointer; user-select:none;
    }
    .tog { position:relative; width:34px; height:19px; flex-shrink:0; }
    .tog input { opacity:0; width:0; height:0; position:absolute; }
    .tog-track {
      position:absolute; inset:0; border-radius:10px;
      background:rgba(255,255,255,.08); border:1px solid var(--border-lit);
      transition:background .2s, border-color .2s;
    }
    .tog-thumb {
      position:absolute; width:13px; height:13px; border-radius:50%;
      background:var(--sub); top:2px; left:2px;
      transition:transform .2s, background .2s;
    }
    .tog input:checked + .tog-track { background:#5865f2; border-color:#5865f2; }
    .tog input:checked + .tog-track + .tog-thumb { transform:translateX(15px); background:#fff; }
    .remember-lbl { font-size:13px; color:var(--sub); font-weight:500; }

    /* ── Divider ── */
    .or {
      display:flex; align-items:center; gap:12px;
      margin:22px 0; color:var(--muted); font-size:11px; font-weight:600;
      text-transform:uppercase; letter-spacing:.7px;
    }
    .or::before,.or::after { content:''; flex:1; height:1px; background:var(--border); }

    /* ── Email form ── */
    .field { margin-bottom:12px; }
    .field label {
      font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.8px;
      color:var(--muted); display:block; margin-bottom:6px;
    }
    .field input {
      width:100%; background:var(--surface); border:1px solid var(--border-lit);
      border-radius:10px; padding:11px 13px; color:var(--text); font-size:14px;
      font-family:'Inter',sans-serif; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .field input:focus { border-color:rgba(88,101,242,.55); box-shadow:0 0 0 3px rgba(88,101,242,.1); }
    .field input::placeholder { color:var(--muted); }

    .btn-email {
      width:100%; background:rgba(255,255,255,.06); color:var(--text);
      border:1px solid var(--border-lit); border-radius:10px; padding:12px;
      font-size:14px; font-weight:600; font-family:'Inter',sans-serif;
      cursor:pointer; margin-top:4px;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:background .15s, border-color .15s;
    }
    .btn-email:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.15); }
    .btn-email:disabled { opacity:.4; cursor:not-allowed; }

    /* ── No email placeholder ── */
    .no-email-box {
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; padding:14px 16px;
      display:flex; align-items:center; gap:12px;
    }
    .no-email-icon {
      width:34px; height:34px; border-radius:8px;
      background:rgba(255,255,255,.04); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
    }
    .no-email-text { font-size:12px; color:var(--sub); line-height:1.5; }
    .no-email-text a { color:var(--accent); text-decoration:none; }
    .no-email-text a:hover { text-decoration:underline; }

    /* ── Error / hint ── */
    .err { color:var(--err); font-size:12px; margin-top:12px; min-height:16px; text-align:center; }
    .hint-box {
      background:rgba(88,101,242,.06); border:1px solid rgba(88,101,242,.2);
      border-radius:8px; padding:9px 12px; margin-top:12px;
      font-size:12px; color:var(--sub); line-height:1.5; text-align:center;
    }
    .hint-box code { background:rgba(255,255,255,.07); padding:1px 5px; border-radius:4px; font-size:11px; }

    .spinner { width:15px; height:15px; border:2px solid rgba(255,255,255,.15); border-top-color:#fff; border-radius:50%; animation:rot .6s linear infinite; display:inline-block; }
    @keyframes rot { to { transform:rotate(360deg); } }

    .email-section { display:none; }
    .email-section.on { display:block; }

    /* ── Footer ── */
    .footer {
      position:relative; z-index:10;
      padding:20px 28px;
      border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:center; gap:20px;
    }
    .footer-link { font-size:11px; color:var(--muted); text-decoration:none; transition:color .15s; }
    .footer-link:hover { color:var(--sub); }
    .footer-sep { width:3px; height:3px; border-radius:50%; background:var(--muted); }
  </style>
</head>
<body>

<div class="glow-a"></div>
<div class="glow-b"></div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">🤖</div>
  <span class="topbar-name" id="topbarName">Itay100K Bot Dashboard</span>
  <div class="topbar-right">
    <div class="status-dot-wrap"><div class="sdot"></div><span id="statusLabel">Online</span></div>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="card">
    <div class="card-strip"></div>
    <div class="card-body">

      <!-- Brand -->
      <div class="brand">
        <div class="av-wrap">
          <div class="av-fallback" id="avFallback">🤖</div>
          <img class="av" id="av" src="" alt="" onerror="this.style.display='none'">
          <div class="av-status"></div>
        </div>
        <div class="brand-name" id="botName">Dashboard</div>
        <div class="brand-sub">Sign in to manage your bot</div>
      </div>

      <!-- Discord login -->
      <a class="btn-discord" id="discordBtn" href="/auth/discord">
        <svg class="discord-icon" viewBox="0 0 127.14 96.36" fill="white">
          <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        Continue with Discord
      </a>

      <!-- Remember me -->
      <label class="remember-row">
        <span class="tog">
          <input type="checkbox" id="rememberMe">
          <span class="tog-track"></span>
          <span class="tog-thumb"></span>
        </span>
        <span class="remember-lbl">Keep me signed in</span>
      </label>

      <!-- Email section (only shown when configured) -->
      <div id="emailSection" class="email-section">
        <div class="or">or</div>
        <form id="emailForm">
          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="pw" placeholder="••••••••" required>
          </div>
          <button class="btn-email" type="submit" id="emailBtn">Sign In</button>
        </form>
      </div>

      <div class="err" id="err"></div>
      <div class="hint-box" id="hint">Discord login requires <code>CLIENT_SECRET</code> in your <code>.env</code> file.</div>

    </div>
  </div>
</div>

<!-- Footer -->
<footer class="footer">
  <span class="footer-link">itay100k Bot</span>
  <div class="footer-sep"></div>
  <span class="footer-link" id="versionLabel">v1.0</span>
  <div class="footer-sep"></div>
  <span class="footer-link">Secure login</span>
</footer>

<script>
  if (localStorage.getItem('dashboard_token')) window.location.href = '/dashboard';

  const urlErr = new URLSearchParams(location.search).get('error');
  if (urlErr) {
    const msgs = {
      no_code:       'Discord login was cancelled.',
      token_failed:  'Failed to get Discord token. Check CLIENT_SECRET.',
      user_failed:   'Could not fetch your Discord profile.',
      oauth_disabled:'Discord login requires CLIENT_SECRET in .env',
    };
    document.getElementById('err').textContent = msgs[urlErr] || 'Login failed: ' + urlErr;
  }

  fetch('/api/loginconfig').then(r=>r.json()).then(cfg => {
    const name = (cfg.username || 'Bot') + ' Dashboard';
    document.getElementById('botName').textContent = name;
    document.getElementById('topbarName').textContent = name;
    if (cfg.avatar) {
      const av = document.getElementById('av');
      av.onload = () => { av.style.display = 'block'; document.getElementById('avFallback').style.display = 'none'; };
      av.src = cfg.avatar;
    }

    if (!cfg.discordEnabled) {
      const b = document.getElementById('discordBtn');
      b.classList.add('disabled');
      b.removeAttribute('href');
    } else {
      document.getElementById('hint').style.display = 'none';
    }

    if (cfg.emailEnabled) {
      document.getElementById('emailSection').classList.add('on');
    }
  }).catch(() => {});

  // Wire remember toggle → Discord href
  const rememberCheck = document.getElementById('rememberMe');
  const discordBtn = document.getElementById('discordBtn');
  function syncDiscordHref() {
    if (discordBtn.hasAttribute('href')) {
      discordBtn.href = rememberCheck.checked ? '/auth/discord?remember=1' : '/auth/discord';
    }
  }
  rememberCheck.addEventListener('change', syncDiscordHref);

  document.getElementById('emailForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('emailBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Signing in…';
    document.getElementById('err').textContent = '';
    try {
      const res = await fetch('/api/login/email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('pw').value,
          remember: rememberCheck.checked,
        }),
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('dashboard_token', data.token);
        window.location.href = '/dashboard';
      } else {
        document.getElementById('err').textContent = data.error || 'Login failed.';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch {
      document.getElementById('err').textContent = 'Could not reach the server.';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
