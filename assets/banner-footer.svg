      <circle cx="512" cy="226" r="15" fill="url(#eye)"/>
      <rect x="214" y="450" width="96" height="160" rx="46" fill="#E6E4FB" stroke="#CFC8F5" stroke-width="8"/>
      <rect x="714" y="450" width="96" height="160" rx="46" fill="#E6E4FB" stroke="#CFC8F5" stroke-width="8"/>
      <rect x="262" y="310" width="500" height="420" rx="150" fill="#FFFFFF" stroke="#CFC8F5" stroke-width="8"/>
      <rect x="325" y="395" width="375" height="205" rx="102" fill="url(#visor)"/>
      <ellipse cx="426" cy="486" rx="44" ry="52" fill="url(#eye)"/>
      <ellipse cx="598" cy="486" rx="44" ry="52" fill="url(#eye)"/>
      <circle cx="442" cy="466" r="13" fill="#F5F3FF"/>
      <circle cx="614" cy="466" r="13" fill="#F5F3FF"/>
      <path d="M 452 552 Q 512 592 572 552" fill="none" stroke="#22D3EE" stroke-width="15" stroke-linecap="round"/>
      <circle cx="452" cy="672" r="11" fill="#C4B5FD"/>
      <circle cx="512" cy="672" r="11" fill="#67E8F9"/>
      <circle cx="572" cy="672" r="11" fill="#D8B4FE"/>
    <g transform="translate(512 560) rotate(-10)" clip-path="url(#orbitFront)"><ellipse cx="0" cy="0" rx="400" ry="88" fill="none" stroke="url(#orbit)" stroke-width="14"/></g>
    <circle cx="880" cy="470" r="16" fill="#FFFFFF" opacity="0.9" filter="url(#glow)"/>
  </g>
  
</svg>
